worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;

        server_name _;

        location / {
            proxy_pass http://twm-public-apache:8081;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		
		location /ogs {
			proxy_pass https://dev-maps.th.gov.bc.ca/geoV05/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=hwy%3AISS_NOTIFICATION&outputFormat=application%2Fjson&maxFeatures=5&srsName=EPSG%3A3857;

			proxy_ssl_server_name on;
			proxy_ssl_protocols TLSv1.2 TLSv1.3;

			proxy_set_header Host dev-maps.th.gov.bc.ca;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

    }
}
